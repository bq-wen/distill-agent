# 真实资料检索评估集：35 篇文档的核心问题（15 条）
#
# 用法：
#   python -m personal_agent.knowledge.eval \
#     --database data/knowledge.db --cases eval_cases/knowledge.yaml \
#     --strategy all --min-score 0.35 --report data/eval-report.json
#
# 设计：每篇主要文档 1 条核心问题（语义表达 + 关键词表达混合），
# 期望命中对应 source_id（与知识库 knowledge_sources 一致）。

metadata:
  description: 真实资料核心问题评估集（15 条，覆盖 12 篇主要文档 + profile/story）

cases:
  - question: "WenGraph 这个图运行时解决的核心问题是什么？"
    expected_source_ids: ["wengraph-overview"]
    note: 语义：文档开头点题"不让 LLM 直接控制真实系统"

  - question: "WenGraph 的阶段评审结论是什么？"
    expected_source_ids: ["wengraph-stage-review"]
    note: 关键词：阶段评审

  - question: "Issue-to-PR Agent 的整体架构是怎么设计的？"
    expected_source_ids: ["issue-architecture"]
    note: 语义：架构文档

  - question: "2026年7月的日志采集事故是怎么复盘和解决的？"
    expected_source_ids: ["issue-incident-story"]
    note: 关键词+语义：日志采集事故复盘

  - question: "C++ RPC 框架的核心模块有哪些，职责如何划分？"
    expected_source_ids: ["cpprpc-rpc-core"]
    note: 语义：RPC 核心分层

  - question: "分布式注册中心怎么实现服务发现和心跳保活？"
    expected_source_ids: ["cpprpc-distributed"]
    note: 语义：注册中心/服务发现/心跳

  - question: "蒸馏 Agent 的治理框架是怎么管控工具风险的？"
    expected_source_ids: ["distill-governance-guard"]
    note: 语义：ToolGuard/风险策略/审批

  - question: "在线数字分身是怎么回答访客问题的？"
    expected_source_ids: ["distill-serving-graph"]
    note: 语义：展示链路/检索/引用

  - question: "RAG 的混合检索原理是什么，为什么需要语义和关键词两路？"
    expected_source_ids: ["distill-rag-retrieval"]
    note: 语义+关键词：混合检索/FTS5/embedding

  - question: "为什么决定做蒸馏链路这个功能？"
    expected_source_ids: ["decision-distillation-pipeline"]
    note: 语义：决策记录

  - question: "你为什么要投入 Agent 方向？"
    expected_source_ids: ["story"]
    note: 语义：个人动机

  - question: "你的知识覆盖哪些主题？"
    expected_source_ids: ["profile"]
    note: 语义：身份文档主题

  - question: "检索质量用什么指标量化评估？"
    expected_source_ids: ["distill-retrieval-eval"]
    note: 关键词：recall/MRR/评估

  - question: "Distill Agent 整体架构评审下来有哪些亮点和风险？"
    expected_source_ids: ["distill-architecture-review"]
    note: 语义：架构评审

  - question: "Issue-to-PR 的网站演示有哪些场景？"
    expected_source_ids: ["issue-website-demo-guide"]
    note: 语义：演示场景
